<div id="app"><div data-scf-boot-placeholder role="status" style="padding:48px 20px;text-align:center;font-family:Arial,sans-serif;color:#2d6a4f">Đang khởi động ứng dụng…</div></div>
<script>
(function(){
  function showBootRecovery(message){
    var app=document.getElementById('app');
    if(!app||!app.querySelector('[data-scf-boot-placeholder]'))return;
    app.replaceChildren();
    var box=document.createElement('div');
    box.setAttribute('role','alert');
    box.style.cssText='max-width:520px;margin:56px auto;padding:24px;text-align:center;font-family:Arial,sans-serif;color:#173f31;background:#fff;border:1px solid #d5e3dc;border-radius:14px;box-shadow:0 8px 28px rgba(0,0,0,.08)';
    var title=document.createElement('h2');title.style.margin='0 0 10px';title.textContent='Kết nối đang chậm';
    var detail=document.createElement('p');detail.style.cssText='margin:0 0 18px;line-height:1.5';detail.textContent=message||'Ứng dụng chưa tải xong. Vui lòng kiểm tra mạng và thử lại.';
    var retry=document.createElement('button');retry.type='button';retry.textContent='Thử tải lại';retry.style.cssText='border:0;border-radius:9px;padding:11px 18px;background:#2d6a4f;color:#fff;font-weight:700;cursor:pointer';retry.onclick=function(){location.reload();};
    box.append(title,detail,retry);app.appendChild(box);
  }
  window.__SCF_SHOW_BOOT_RECOVERY=showBootRecovery;
  window.addEventListener('error',function(event){
    var target=event.target;
    if(target&&target.tagName==='SCRIPT')showBootRecovery('Không tải được một thành phần của ứng dụng. Hãy thử tải lại.');
  },true);
  setTimeout(function(){showBootRecovery('Mạng hoặc máy chủ phản hồi quá chậm. Dữ liệu của bạn không bị mất.');},12000);
})();
</script>
